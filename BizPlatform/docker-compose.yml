# BizPlatform – full stack: PostgreSQL + API + Caddy (HTTPS) + encrypted nightly backups.
# Start:  ./scripts/setup.sh   (creates .env with random secrets)  then  docker compose up -d --build
name: bizplatform

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  db:
    <<: *hardening
    image: postgres:16-alpine
    cap_add: ["CHOWN", "SETUID", "SETGID", "FOWNER", "DAC_READ_SEARCH"]
    environment:
      POSTGRES_DB: bizplatform
      POSTGRES_USER: bizplatform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup.sh}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes: ["db-data:/var/lib/postgresql/data"]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizplatform -d bizplatform"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    <<: *hardening
    build: ./backend
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      BIZ_ENV: production
      BIZ_DATABASE_URL: postgresql+psycopg://bizplatform:${POSTGRES_PASSWORD}@db:5432/bizplatform
      BIZ_ENCRYPTION_KEY: ${BIZ_ENCRYPTION_KEY:?run scripts/setup.sh}
      BIZ_REQUIRE_2FA: ${BIZ_REQUIRE_2FA:-true}
      BIZ_ORG_NAME: ${BIZ_ORG_NAME:-BizPlatform}
      BIZ_COOKIE_SECURE: "true"
    depends_on:
      db: { condition: service_healthy }
    networks: [internal, edge]

  web:
    <<: *hardening
    build: ./frontend
    cap_add: ["NET_BIND_SERVICE"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      TLS_MODE: ${TLS_MODE:-internal}
    ports: ["80:80", "443:443"]
    volumes: ["caddy-data:/data", "caddy-config:/config"]
    depends_on: [backend]
    networks: [edge]

  backup:
    <<: *hardening
    image: postgres:16-alpine
    cap_add: ["SETUID", "SETGID"]
    environment:
      PGHOST: db
      PGUSER: bizplatform
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: bizplatform
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?run scripts/setup.sh}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

networks:
  internal:
    internal: true   # database is never reachable from outside
  edge: {}

volumes:
  db-data:
  caddy-data:
  caddy-config:
